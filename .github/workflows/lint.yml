name: Lint & Format

# 质量门禁：Prettier（排版）+ oxlint（可能出错的地方）+ tsc（类型）+ 构建
#
# 部署已迁到 Cloudflare Workers：仓库不再保留 GitHub Pages 部署流水线，
# 也不再需要 pages: write / id-token: write 权限与 github-pages environment。
# 生产与预览部署由 Cloudflare 侧 Workers Builds 的 Git 集成自动执行，
# 所以这里除了风格检查，还要自己把 next build 跑一遍：检查不过就不该发版。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prettier + oxlint + tsc + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先查排版：报错信息是「哪个文件没按 Prettier 排」，比 lint 报错更好定位
      - name: Prettier (format:check)
        run: pnpm run format:check

      - name: oxlint
        run: pnpm run lint

      # 类型检查几秒出结果，不用等整次静态导出就能看到类型错误
      - name: TypeScript (tsc --noEmit)
        run: pnpm run typecheck

      # 同步字体 → next build → 产物校验：路由漏生成 / 字体漏同步都会直接失败
      - name: Build (sync-fonts + next build + verify-output → out/)
        run: pnpm run build
